# Global options:

[mypy]
# The pydantic plugin teaches mypy that BaseModel fields with Field(default=...) /
# Field(None) defaults are optional at construction; without it every model with
# defaulted fields reports spurious "Missing named argument" call-arg errors.
plugins = pydantic.mypy
packages = agent_assembly,test
exclude = (?x)(
    test/unit_test.{1,64}.py    # Ignore the code of unit test because of the usage of mock
  )

show_traceback = True

warn_unused_configs = True
;disallow_untyped_calls = True
;disallow_untyped_defs = True
;disallow_incomplete_defs = True
;check_untyped_defs = True
;disallow_untyped_decorators = True
warn_redundant_casts = True
warn_unused_ignores = True
;warn_return_any = True
;no_implicit_reexport = True
strict_equality = True
strict_concatenate = True

# Generated gRPC/protobuf stubs (scripts/gen_proto.py). These are emitted by
# protoc + grpcio-tools and committed verbatim; a CI drift check regenerates
# them and asserts no diff, so they must not be hand-edited to satisfy mypy.
# Skip type-checking the generated output rather than annotate code we do not own.
[mypy-agent_assembly.proto.*]
ignore_errors = True

[mypy-agent_assembly.adapters.base]
strict = True

[mypy-agent_assembly.adapters.registry]
strict = True
