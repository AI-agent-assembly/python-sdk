[package]
name = "aa-ffi-python"
version = "0.0.0"
edition = "2021"
description = "PyO3 bridge crate for the Agent Assembly Python SDK"
license = "MIT"

[lib]
name = "aa_ffi_python"
crate-type = ["cdylib"]

[dependencies]
# Shared crates consumed via git-SHA pin (ADR 0002, AAASM-2559). aa-core,
# aa-proto, and aa-sdk-client must share one SHA so cargo resolves a single
# checkout of the agent-assembly workspace.
aa-core = { git = "https://github.com/AI-agent-assembly/agent-assembly.git", rev = "9cf8a033d39c870ba46a0929b62261d125a00a09", package = "aa-core", features = ["serde"] }
aa-proto = { git = "https://github.com/AI-agent-assembly/agent-assembly.git", rev = "9cf8a033d39c870ba46a0929b62261d125a00a09", package = "aa-proto" }
aa-sdk-client = { git = "https://github.com/AI-agent-assembly/agent-assembly.git", rev = "9cf8a033d39c870ba46a0929b62261d125a00a09", package = "aa-sdk-client" }
prost = "0.14"
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
