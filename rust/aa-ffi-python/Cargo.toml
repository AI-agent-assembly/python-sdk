[package]
name = "aa-ffi-python"
version = "0.0.0"
edition = "2021"
description = "PyO3 bridge crate for the Agent Assembly Python SDK"
license = "MIT"

[lib]
name = "aa_ffi_python"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.20"
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "sync", "time"] }
