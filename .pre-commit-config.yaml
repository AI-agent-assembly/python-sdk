# quickstart_snippets/ holds verbatim, vendored copies of the examples repo's
# quick-start regions (AAASM-4513); several are partial governance slices (e.g.
# a trailing `try:`/`with … as ctx:` with no body) that are valid as doc
# excerpts but not as standalone modules. Formatting/parsing them would rewrite
# the vendored copy and break the drift check, so exclude the dir from all hooks.
exclude: '.github/|docs/|quickstart_snippets/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Single Python formatter/linter (AAASM-4915): replaces the former
    # isort + autoflake + black trio. `ruff-check --fix` folds in isort (rule
    # `I`) and autoflake's unused-import/var removal (`F401`/`F841`); the shared
    # ruff.toml is the source of truth for select/ignore/format config.
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run mypy inside the uv-managed project env so it resolves the SDK's
        # runtime + optional framework deps (pydantic, httpx, pydantic-ai, …).
        # The upstream mirrors-mypy hook installs into an isolated venv that lacks
        # these, which made every BaseModel/framework subclass resolve to `Any`.
        # Type-check the whole project via mypy.ini's `packages =` discovery (no
        # file paths) so the generated proto .py/.pyi pairs don't trip a
        # "Duplicate module" error and the hook stays identical to the configured
        # `mypy` invocation.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args:
          - --ignore-missing-imports
          - --show-traceback

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.7.13
    hooks:
      - id: uv-lock
