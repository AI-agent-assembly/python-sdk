name: README Version Drift Check

# AAASM-4918 (ADR 0013): the README `aasm --version` sample output is a
# hand-typed version literal that sits outside the pyproject.toml version anchor
# (the SoT). This gate re-audits it on every PR and fails if the sample drifted
# from the anchor, so a stale sample output can never merge.

on:
  pull_request:
    paths:
      - "README.md"
      - "pyproject.toml"
      - "scripts/check_readme_version.py"
      - ".github/workflows/readme-version-check.yml"
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-drift:
    name: README version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Audit README sample output against the pyproject.toml anchor
        run: python scripts/check_readme_version.py --check
