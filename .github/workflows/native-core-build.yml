name: Native Core Build Check

on:
  pull_request:
    paths:
      - "native/**"
      # FFI-binding Python files that import the native `_core` module.
      - "agent_assembly/__init__.py"
      - "agent_assembly/types.py"
      - ".github/workflows/native-core-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Create virtual environment
        run: uv venv

      - name: Build native module with maturin
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: uv tool run maturin develop --manifest-path native/aa-ffi-python/Cargo.toml

      - name: Verify native module import
        run: |
          uv run python -c "from agent_assembly._core import RuntimeClient, GovernanceEvent"
