name: CI

on:
  workflow_call:
    inputs:
      run_e2e:
        description: "The testing type. In generally, it only has 2 options: 'unit-test' and 'integration-test'."
        type: boolean
        required: false
        default: false
    secrets:
      e2e_test_api_token:
        description: "Set the Slack bot token for end-to-end test."
        required: false
      codecov_token:
        description: "The API token for uploading testing coverage report to Codecov."
        required: false
      sonar_token:
        description: "The API token for uploading testing coverage report to Coveralls."
        required: false

jobs:
  build-and-test:
#    name: Run all tests and organize all test reports
    uses: ./.github/workflows/rw_build_and_test.yaml
    with:
      run_e2e: ${{ inputs.run_e2e }}
    secrets:
      e2e_test_api_token: ${{ secrets.e2e_test_api_token }}

  unit-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') && 
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) || 
            (github.event_name == 'push' && github.ref_name == 'master')
        ) 
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@master
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: unit-test
      upload-to-codecov: true
      codecov_flags: unit  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: AI-agent-assembly/python-sdk

  integration-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'master')
        )
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@master
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: integration-test
      upload-to-codecov: true
      codecov_flags: integration  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: AI-agent-assembly/python-sdk

  e2e-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            (contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'master')
        )) &&
        inputs.run_e2e == true
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@master
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: e2e-test
      upload-to-codecov: true
      codecov_flags: e2e  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: AI-agent-assembly/python-sdk

  contract-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'master')
        )
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@master
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: contract-test
      upload-to-codecov: true
      codecov_flags: contract  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: AI-agent-assembly/python-sdk

  all-test_codecov_finish:
#    name: Organize and generate the testing report and upload it to Codecov
    if: ${{
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'master')
        )
      }}
    needs: build-and-test
    uses: Chisanan232/GitHub-Action_Reusable_Workflows-Python/.github/workflows/rw_upload_test_cov_report.yaml@master
    secrets:
      codecov_token: ${{ secrets.codecov_token }}
    with:
      test_type: all-test
      upload-to-codecov: true
      codecov_flags: all  # Required if 'upload-to-codecov' is true
      codecov_name: agent-assembly  # Required if 'upload-to-codecov' is true
      codecov_slug: AI-agent-assembly/python-sdk

  sonarcloud_finish:
#    name: SonarCloud Scan
    if: ${{
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
        (
            contains(fromJSON('["pull_request","workflow_dispatch","schedule"]'), github.event_name) ||
            (github.event_name == 'push' && github.ref_name == 'master')
        )
      }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Required by SonarCloud to correctly compute PR/new-code deltas.
          fetch-depth: 0

      - name: Download all-test coverage XML report
        uses: actions/download-artifact@v8
        with:
          name: all-test_coverage_xml_report
          path: ./

      - name: Verify coverage XML report exists
        run: |
          if [ ! -f "./coverage_all-test.xml" ]; then
            echo "Expected coverage report ./coverage_all-test.xml not found."
            echo "Current files:"
            ls -la
            exit 1
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: https://sonarcloud.io
