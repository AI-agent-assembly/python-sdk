name: Benchmarks

on:
  pull_request:
    # Only run when a PR is (re)labeled; the job below gates on the 'benchmark' label
    # so benchmarks stay off the default per-PR path (noisy on shared runners).
    types: [labeled]
    branches:
      - "master"
    paths:
      - "agent_assembly/**/*.py"
      - "test/bench/**/*.py"
      - ".github/workflows/benchmarks.yml"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run performance benchmarks
    if: contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run benchmark suite
        run: |
          uv run pytest test/bench/ \
            --benchmark-only \
            --benchmark-disable-gc \
            --benchmark-json=benchmark-results.json \
            -v

      - name: Run latency contract tests
        run: |
          uv run pytest test/bench/test_latency_contracts.py \
            --benchmark-disable \
            -v

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30
