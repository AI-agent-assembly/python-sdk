version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "🔍 enhancement"
      - "🤖 github actions"
      - "dependencies"
    commit-message:
      prefix: ⬆

  # Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "🔍 enhancement"
      - "🐍 python"
      - "dependencies"
    commit-message:
      prefix: ⬆

  # Rust native binding (PyO3) — rust/aa-ffi-python
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    labels:
      - "🔍 enhancement"
      - "🦀 rust"
      - "dependencies"
    commit-message:
      prefix: ⬆
