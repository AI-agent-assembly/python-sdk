[package]
name = "aa-ffi-python"
version = "0.0.0"
edition = "2021"
description = "PyO3 bridge crate for the Agent Assembly Python SDK"
license = "MIT"

[lib]
name = "aa_ffi_python"
crate-type = ["cdylib"]

[dependencies]
# Shared crates consumed via git-SHA pin (ADR 0002, AAASM-2559). aa-core,
# aa-proto, and aa-sdk-client must share one SHA so cargo resolves a single
# checkout of the agent-assembly workspace.
#
# Pinned to agent-assembly AAASM-3683, which adds the `sdk_version` field to
# `AssemblyConfig` and threads it through `spawn_ipc_thread` into the signed IPC
# handshake — the version this shim now forwards from the PyPI package version.
# Re-pin to the squash-merge commit once PR #1226 lands on master.
aa-core = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "de19926b5061108b2d9ffddae73bcdb598dc07d5", package = "aa-core", features = ["serde"] }
aa-proto = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "de19926b5061108b2d9ffddae73bcdb598dc07d5", package = "aa-proto" }
aa-sdk-client = { git = "https://github.com/ai-agent-assembly/agent-assembly.git", rev = "de19926b5061108b2d9ffddae73bcdb598dc07d5", package = "aa-sdk-client" }
prost = "0.14"
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `AssemblyClient::register` is async (tonic gRPC). The shim's `register`
# surface is synchronous, so it drives that future on a private current-thread
# runtime — hence only the `rt` feature is needed here.
tokio = { version = "1", features = ["rt"] }
